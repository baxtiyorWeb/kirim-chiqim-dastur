version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kirim_chiqim_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DATABASE_URL=postgres://postgres:moliya_secret@postgres:5432/moliya_db?sslmode=disable
      - JWT_SECRET=moliya_jwt_production_secret_change_me_in_real_deployment
      - CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: kirim_chiqim_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=moliya_secret
      - POSTGRES_DB=moliya_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moliya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
